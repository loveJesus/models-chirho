# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life. - John 3:16

[project]
name = "topical-passage-classifier-chirho"
version = "0.1.0"
description = "Semantic topical Bible search using fine-tuned all-MiniLM-L6-v2 sentence transformer"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "loveJesus", email = "loveJesus@perffection.com"}
]

dependencies = [
    "sentence-transformers>=2.7",
    "transformers>=4.40",
    "datasets>=2.19",
    "torch>=2.3",
    "accelerate>=0.30",
    "gradio>=4.0",
    "pyyaml",
    "safetensors",
    "huggingface-hub>=0.23",
    "python-dotenv",
    "numpy",
    "scikit-learn",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
