# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life. - John 3:16

[project]
name = "manuscript-variant-analyzer-chirho"
version = "0.1.0"
description = "ML classifier for NT manuscript variant type analysis using mT5 on STEPBible TAGNT data"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "loveJesus", email = "loveJesus@perffection.com"}
]

dependencies = [
    "transformers>=4.40",
    "datasets>=2.19",
    "torch>=2.3",
    "accelerate>=0.30",
    "evaluate",
    "sentencepiece",
    "protobuf",
    "gradio>=4.0",
    "pyyaml",
    "safetensors",
    "huggingface-hub>=0.23",
    "python-dotenv",
    "numpy",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
