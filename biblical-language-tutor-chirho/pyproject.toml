# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life. - John 3:16

[project]
name = "biblical-language-tutor-chirho"
version = "0.1.0"
description = "mT5-based morphological parsing and interlinear glossing for biblical Hebrew and Greek"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "loveJesus", email = "loveJesus@perffection.com"}
]

dependencies = [
    "transformers>=4.40",
    "datasets>=2.19",
    "torch>=2.3",
    "accelerate>=0.30",
    "evaluate",
    "sentencepiece",
    "protobuf",
    "sacrebleu",
    "gradio>=4.0",
    "pyyaml",
    "safetensors",
    "huggingface-hub>=0.23",
    "python-dotenv",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
runpod = [
    "runpod",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
